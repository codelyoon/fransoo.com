<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="theme-color" content="#000000" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      color: #c8e6c8;
      font-family: "IBM Plex Mono", monospace;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      position: relative;
    }
    .static-bg {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 0;
    }
    .static-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.18;
      animation: staticMove 0.12s steps(3) infinite;
    }
    @keyframes staticMove {
      0% { transform: translate(0, 0); }
      33% { transform: translate(-2px, 1px); }
      66% { transform: translate(1px, -1px); }
      100% { transform: translate(-1px, 2px); }
    }
    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 30;
      opacity: 0.7;
    }
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.85) 100%);
      z-index: 25;
    }
    .terminal {
      position: relative;
      z-index: 10;
      max-width: 680px;
      width: 100%;
      padding: 60px 40px;
      text-align: left;
    }
    .line {
      font-size: clamp(16px, 2.8vw, 22px);
      line-height: 1.5;
      letter-spacing: 0.01em;
      color: #b8d4b8;
      text-shadow: 0 0 6px rgba(140, 200, 140, 0.4);
      min-height: 1.5em;
      margin-bottom: 28px;
      white-space: pre-wrap;
    }
    .line.final {
      margin-top: 12px;
      margin-bottom: 0;
      color: #d0e8d0;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: #b8d4b8;
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      box-shadow: 0 0 6px rgba(140, 200, 140, 0.6);
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .attribution {
      margin-top: 64px;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: #4a5a4a;
      opacity: 0;
      animation: fadeIn 1.5s ease-out 8s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 0.6; }
    }
    .flicker-screen {
      animation: screenFlicker 9s infinite;
    }
    @keyframes screenFlicker {
      0%, 100% { opacity: 1; }
      6% { opacity: 0.92; }
      7% { opacity: 1; }
      23% { opacity: 0.78; }
      24% { opacity: 0.96; }
      25% { opacity: 1; }
      51% { opacity: 0.85; }
      52% { opacity: 0.55; }
      53% { opacity: 1; }
      81% { opacity: 0.88; }
      82% { opacity: 1; }
      94% { opacity: 0.7; }
      95% { opacity: 0.4; }
      96% { opacity: 1; }
    }
    @media (max-width: 600px) {
      .terminal { padding: 40px 24px; }
      .line { margin-bottom: 22px; }
    }
  </style>
</head>
<body>
  <div class="static-bg"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="terminal flicker-screen">
    <div class="line" id="l1"></div>
    <div class="line" id="l2"></div>
    <div class="line" id="l3"></div>
    <div class="line" id="l4"></div>
    <div class="line final" id="l5"></div>
    <div class="attribution">— Henry Fransoo</div>
  </div>

  <script>
    const lines = [
      "You will regret the chances you never took more than the risks you were afraid to face.",
  "So let go of what keeps you anchored.",
  "Step beyond the familiar. Follow the winds of possibility.",
  "Live boldly. Dream without limits. Leave nothing unexplored."
    ];
    const ids = ["l1", "l2", "l3", "l4", "l5"];
    let lineIndex = 0;
    let charIndex = 0;

    function type() {
      if (lineIndex >= lines.length) return;
      const el = document.getElementById(ids[lineIndex]);
      const text = lines[lineIndex];
      if (charIndex < text.length) {
        el.textContent = text.slice(0, charIndex + 1);
        charIndex++;
        setTimeout(type, 28 + Math.random() * 40);
      } else {
        el.innerHTML += '<span class="cursor"></span>';
        setTimeout(() => {
          const cursors = el.querySelectorAll(".cursor");
          if (cursors.length) cursors[cursors.length - 1].remove();
          lineIndex++;
          charIndex = 0;
          if (lineIndex < lines.length) {
            setTimeout(type, 600);
          }
        }, 800);
      }
    }

    setTimeout(type, 1200);
  </script>
</body>
</html>
