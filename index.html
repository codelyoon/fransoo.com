<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="theme-color" content="#000000" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --ink: #d4cdc0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "EB Garamond", Georgia, serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      position: relative;
    }
    .screen {
      position: relative;
      z-index: 10;
      max-width: 720px;
      padding: 40px 32px;
      text-align: center;
    }
    .line {
      font-size: clamp(22px, 4.2vw, 38px);
      line-height: 1.35;
      letter-spacing: -0.015em;
      font-weight: 400;
      color: #e0d8cc;
      text-shadow:
        0 0 12px rgba(180, 200, 160, 0.45),
        0 0 3px rgba(255,255,255,0.25);
      margin: 0;
      padding: 0;
    }
    .line + .line {
      margin-top: 36px;
    }
    .line.short {
      margin-top: 52px;
      font-size: clamp(24px, 4.6vw, 42px);
    }
    .attribution {
      margin-top: 72px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #5a544c;
      opacity: 0.65;
    }
    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18) 0px,
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      z-index: 20;
      opacity: 0.55;
    }
    .static {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.1;
      mix-blend-mode: overlay;
      z-index: 15;
      animation: staticShift 0.15s steps(2) infinite;
    }
    @keyframes staticShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-1px, 1px); }
    }
    .flicker {
      animation: flicker 7s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      3% { opacity: 0.82; }
      4% { opacity: 1; }
      18% { opacity: 0.65; }
      19% { opacity: 0.92; }
      20% { opacity: 1; }
      47% { opacity: 0.78; }
      48% { opacity: 0.5; }
      49% { opacity: 1; }
      76% { opacity: 0.85; }
      77% { opacity: 1; }
      91% { opacity: 0.7; }
      92% { opacity: 0.35; }
      93% { opacity: 1; }
    }
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
      z-index: 25;
    }
    .fade {
      animation: fadeIn 4.5s ease-out forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @media (max-width: 600px) {
      .screen { padding: 32px 20px; }
      .line + .line { margin-top: 28px; }
      .line.short { margin-top: 40px; }
      .attribution { margin-top: 56px; }
    }
  </style>
</head>
<body>
  <div class="static"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="screen fade">
    <p class="line flicker">Twenty years from now, you will be more disappointed by the things that you didn't do than by the ones you did do.</p>
    <p class="line flicker">So throw off the bowlines.</p>
    <p class="line flicker">Sail away from the safe harbor.</p>
    <p class="line flicker">Catch the trade winds in your sails.</p>
    <p class="line short flicker">Explore. Dream. Discover.</p>
    <p class="attribution">— Unknown</p>
  </div>
</body>
</html>
