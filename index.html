<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fransoo.com</title>
  <meta name="theme-color" content="#000000" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --ink: #c9c2b5;
      --glow: rgba(180, 200, 160, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "EB Garamond", Georgia, serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      position: relative;
    }
    .screen {
      position: relative;
      z-index: 10;
      max-width: 820px;
      padding: 80px 48px;
      text-align: center;
    }
    .quote {
      font-size: clamp(20px, 3.6vw, 32px);
      line-height: 1.65;
      letter-spacing: -0.01em;
      font-weight: 400;
      color: #d4cdc0;
      text-shadow:
        0 0 8px rgba(180, 200, 160, 0.4),
        0 0 2px rgba(255,255,255,0.3);
      position: relative;
    }
    .attribution {
      margin-top: 52px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #6a645c;
      opacity: 0.7;
    }
    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
      );
      z-index: 20;
      opacity: 0.6;
    }
    .static {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.12;
      mix-blend-mode: overlay;
      z-index: 15;
      animation: staticShift 0.2s steps(2) infinite;
    }
    @keyframes staticShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-2px, 1px); }
    }
    .flicker {
      animation: flicker 8s infinite;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      4% { opacity: 0.85; }
      5% { opacity: 1; }
      12% { opacity: 0.7; }
      13% { opacity: 0.95; }
      14% { opacity: 1; }
      42% { opacity: 0.9; }
      43% { opacity: 0.6; }
      44% { opacity: 1; }
      71% { opacity: 0.8; }
      72% { opacity: 1; }
      88% { opacity: 0.75; }
      89% { opacity: 0.4; }
      90% { opacity: 1; }
    }
    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%);
      z-index: 25;
    }
    .curve {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.3) 100%);
      z-index: 5;
    }
    .fade {
      animation: fadeIn 5s ease-out forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @media (max-width: 600px) {
      .screen { padding: 48px 28px; }
    }
  </style>
</head>
<body>
  <div class="curve"></div>
  <div class="static"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="screen fade">
    <p class="quote flicker">
      Twenty years from now, you will be more disappointed by the things that you didn't do than by the ones you did do.
    </p>
    <p class="quote flicker">
      So throw off the bowlines.
    </p>
    <p class="quote flicker">
      Sail away from the safe harbor.
    </p>
    <p class="quote flicker">
      Catch the trade winds in your sails.
    </p>
    <p class="quote flicker">
      Explore. Dream. Discover.
    </p>
    <p class="attribution">— Unknown</p>
  </div>
</body>
</html>
